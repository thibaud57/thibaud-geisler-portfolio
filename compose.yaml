services:
  nextjs:
    image: ghcr.io/thibaud57/thibaud-geisler-portfolio:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      ASSETS_PATH: /app/assets
    volumes:
      - portfolio_assets:/app/assets
    # start_period couvre `prisma migrate deploy`, qui précède le serveur dans le CMD.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

volumes:
  portfolio_assets:
