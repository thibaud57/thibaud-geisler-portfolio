version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # "/" ne couvre que .github/workflows : les actions composites locales
    # epinglent aussi des actions tierces, a suivre par leur propre entree
    directories:
      - /
      - /.github/actions/*
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
