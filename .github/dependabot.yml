version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    # Majeure bloquée par typescript-eslint (VERSIONS.md § Montées Bloquées)
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # "/" ne couvre que .github/workflows : les actions composites locales
    # epinglent aussi des actions tierces, a suivre par leur propre entree
    directories:
      - /
      - /.github/actions/*
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
