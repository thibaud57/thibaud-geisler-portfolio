name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

# Annulation sur PR seulement. Hors PR un groupe par run : un groupe ne garde qu'un run en attente
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Doc seule : jobs sautés, `ci` passe. Un `paths-ignore` laisserait `ci` en attente
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      # Lecture des fichiers de la PR par paths-filter
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sur push, paths-filter trouve le commit précédent sans fetch
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            source:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'

  quality:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env for just (dotenv-required)
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://test:test@localhost:5432/test_db
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          EOF

      # Versions de pnpm et de Node lues dans devEngines de package.json ; installe aussi les dependances
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          # L'install de l'action remplace celui du workflow : ce flag garde l'echec sur lockfile absent.
          require-lockfile: true

      - uses: ./.github/actions/setup-just

      # uvx pour zizmor (just lint) ; aucun fichier Python à hacher pour une clé de cache
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          # Un glob par argument : `hashFiles` ne développe pas les accolades, `src/**/*.{ts,tsx}`
          # rendait une chaîne vide et la clé ne changeait jamais avec les sources.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # `just lint` appelle actionlint, absent des runners. Script epingle au commit du tag
      # v1.7.12 et binaire epingle par l'argument : une URL sur `main` serait mutable.
      - name: Installer actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: just lint
        env:
          # Audits en ligne de zizmor
          GH_TOKEN: ${{ github.token }}
      - run: just typecheck
      - run: just test

      # DB injoignable : prouve que le build ne lit jamais la base (ADR-022), comme le sandbox
      # BuildKit de deploy.yml. Port 1 : refus de connexion immédiat, pas de timeout qui traîne.
      - run: just build
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/test_db

      - name: Audit dependencies
        id: audit
        run: just audit
        continue-on-error: true

      # `continue-on-error` conclut le step en succès : sans ce warning, un audit rouge passe inaperçu.
      - name: Signaler l'échec de l'audit
        if: steps.audit.outcome == 'failure'
        run: echo "::warning title=Audit des dépendances::just audit a relevé des vulnérabilités (high ou plus)"

  # Seul check à exiger : les jobs ci-dessus se renomment sans toucher aux réglages
  ci:
    needs: [changes, quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Job sauté (`skipped`) = doc seule, accepté ; détection en échec, refusée
      - name: Vérifier les jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [ "$CHANGES" = "success" ] || { echo "::error title=CI::Détection des fichiers modifiés en échec"; exit 1; }
          case " $RESULTS " in *" failure "*|*" cancelled "*) echo "::error title=CI::Un job au moins n'est pas passé"; exit 1 ;; esac
