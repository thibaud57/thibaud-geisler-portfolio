name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

# Un push qui en chasse un autre annule le run précédent, mais seulement sur PR :
# sur main chaque commit garde son propre verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            source:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'

  quality:
    needs: changes
    if: needs.changes.outputs.source == 'true' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create .env for just (dotenv-required)
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://test:test@localhost:5432/test_db
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          EOF

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          # Un glob par argument : `hashFiles` ne développe pas les accolades, `src/**/*.{ts,tsx}`
          # rendait une chaîne vide et la clé ne changeait jamais avec les sources.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Apply Prisma migrations to test DB
        run: pnpm prisma migrate deploy

      # `just lint` appelle actionlint, absent des runners. Script epingle au commit du tag
      # v1.7.12 et binaire epingle par l'argument : une URL sur `main` serait mutable.
      - name: Installer actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: just lint
      - run: just typecheck
      - run: just test

      # DB injoignable : prouve que le build ne lit jamais la base (ADR-022), comme le sandbox
      # BuildKit de deploy.yml. Port 1 : refus de connexion immédiat, pas de timeout qui traîne.
      - run: just build
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/test_db

      - name: Audit dependencies
        id: audit
        run: just audit
        continue-on-error: true

      # `continue-on-error` conclut le step en succès : sans ce warning, un audit rouge passe inaperçu.
      - name: Signaler l'échec de l'audit
        if: steps.audit.outcome == 'failure'
        run: echo "::warning title=Audit des dépendances::just audit a relevé des vulnérabilités (high ou plus)"

  ci:
    needs: [changes, quality]
    # always(), pas !cancelled() : un job sauté compte comme réussi pour un check requis, un run
    # annulé laisserait merger sans quality. Ici, il tourne et échoue (vérification ci-dessous).
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Changes detection job did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.quality.result }}" == "failure" || "${{ needs.quality.result }}" == "cancelled" ]]; then
            echo "Quality job failed or cancelled"
            exit 1
          fi
          echo "CI OK (quality passed or doc-only skip)"
