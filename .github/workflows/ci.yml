name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

# Un push qui en chasse un autre annule le run précédent, mais seulement sur PR :
# sur main chaque commit garde son propre verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            source:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'

  quality:
    needs: changes
    if: needs.changes.outputs.source == 'true' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create .env for just (dotenv-required)
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://test:test@localhost:5432/test_db
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          EOF

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Apply Prisma migrations to test DB
        run: pnpm prisma migrate deploy

      # `just lint` appelle actionlint, absent des runners. Script epingle au commit du tag
      # v1.7.12 et binaire epingle par l'argument : une URL sur `main` serait mutable.
      - name: Installer actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: just lint
      - run: just typecheck
      - run: just test

      # generateStaticParams des pages projet lit la DB : sans seed il renvoie [],
      # ce que Cache Components refuse au build. Seed juste avant, pas avant les
      # tests d'intégration qui partagent cette DB et pourraient la modifier.
      - run: just db-seed

      - run: just build

      - name: Audit dependencies
        run: just audit
        continue-on-error: true

  ci:
    needs: [changes, quality]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Changes detection job did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.quality.result }}" == "failure" || "${{ needs.quality.result }}" == "cancelled" ]]; then
            echo "Quality job failed or cancelled"
            exit 1
          fi
          echo "CI OK (quality passed or doc-only skip)"
